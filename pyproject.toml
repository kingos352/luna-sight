# Ortak araç ayarları. Paketleme yapılmaz; src/ düzeni pytest tarafından yola eklenir.

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
