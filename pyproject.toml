[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-sight"
version = "0.1.0"
description = "NASA Space Apps - Moon South Pole Landing Site & Visibility Tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "requests>=2.34",
    "rasterio>=1.5",
    "pyproj>=3.8",
    "streamlit>=1.67",
    "plotly>=7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2",
]

[tool.setuptools.packages.find]
where = ["src"]
