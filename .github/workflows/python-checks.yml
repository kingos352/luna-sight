name: Python checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ekip Windows kullanıyor, depo kontrolleri Linux'ta koşuyor.
        # İkisi de kapıdan geçmeli.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install shared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify dependency tree
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        # --record-mode=none: kaset dışında ağa çıkan test kapıdan geçmez.
        # JPL Horizons erişilemediğinde CI kırmızıya dönmemeli.
        run: >-
          python -m pytest
          --record-mode=none
          --cov=luna_sight
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
