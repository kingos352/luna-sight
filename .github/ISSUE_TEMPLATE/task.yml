name: Görev
description: 24 saatlik operasyon için somut iş paketi
title: "[K?] "
labels: ["task"]
body:
  - type: dropdown
    id: role
    attributes:
      label: Rol
      options: [K1, K2, K3, K4, K5]
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Somut çıktı
      description: Çalışır halde hangi sonuç teslim edilecek?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Kabul ölçütleri
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: gate
    attributes:
      label: Hedef kapı
      placeholder: T+4 / T+7 / T+10 / T+13 / T+16 / T+19 / T+23
  - type: textarea
    id: dependencies
    attributes:
      label: Bağımlılıklar ve engeller

